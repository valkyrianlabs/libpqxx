name: Upstream watch

# Weekly: has jtv/libpqxx published a newer *stable* release (by version; prereleases ignored)?
# If so, pin it, build and test it as a candidate (tools/upstream-candidate) and open a pull
# request with the report.
#
# Auto-release: when `tools/pqxx-sdk gate` passes (candidate green, a patch release of the pinned
# major.minor, upstream build files and requirements.json unchanged) and main has not moved since
# the candidate was built, the pull request is merged, `vlr cut <VERSION>` tags the merge, and
# release.yml is dispatched on the tag to publish. Anything else stays a pull request labelled
# `needs-review`, with the reasons, for a maintainer to review, merge and cut (docs/MAINTENANCE.md).
# The repository variable UPSTREAM_AUTO_RELEASE=false turns auto-release off (pull requests only).
#
# A tag pushed with GITHUB_TOKEN starts no workflow, so the release is started with
# workflow_dispatch (which GITHUB_TOKEN may trigger) on the tag, exactly like a manual publish.
#
# Needs "Allow GitHub Actions to create and approve pull requests" in the repository settings.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-watch
  cancel-in-progress: false

env:
  CI_CACHE_NAMES: ccache
  PQXX_JOBS: "8"
  CI_MEMORY: 6g

jobs:
  discover:
    runs-on: [self-hosted, Linux, X64, vps-ci]
    defaults:
      run:
        shell: bash ./ci/run-ci bash -euo pipefail {0}
    timeout-minutes: 10
    outputs:
      update: ${{ steps.discover.outputs.update }}
      latest: ${{ steps.discover.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/pqxx-sdk discover --github-output

  candidate:
    needs: discover
    if: needs.discover.outputs.update == 'true'
    runs-on: [self-hosted, Linux, X64, vps-ci]
    permissions:
      contents: write
      pull-requests: write
      actions: write
    timeout-minutes: 60
    env:
      BRANCH: upstream/libpqxx-${{ needs.discover.outputs.latest }}
      AUTO_RELEASE: ${{ vars.UPSTREAM_AUTO_RELEASE != 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip if a pull request branch for this release exists
        id: existing
        shell: bash ./ci/run-ci bash -euo pipefail {0}
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pin, build and test the candidate
        id: candidate
        if: steps.existing.outputs.exists == 'false'
        continue-on-error: true
        shell: bash ./tools/ci-guard -- ./ci/run-ci bash -euo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/upstream-candidate "${{ needs.discover.outputs.latest }}"
      - name: Release gate
        id: gate
        if: steps.existing.outputs.exists == 'false'
        shell: bash ./ci/run-ci bash -euo pipefail {0}
        run: |
          result=release/build/upstream-candidate/result.json
          if [ ! -f "$result" ]; then
            printf 'release=false\nblockers<<GATE_EOF\n- the candidate stopped before writing %s\nGATE_EOF\n' "$result" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/pqxx-sdk gate "$result" --github-output
      - name: Open a pull request with the report
        id: pr
        if: steps.existing.outputs.exists == 'false'
        shell: bash ./ci/run-ci bash -euo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.candidate.outcome }}
          LATEST: ${{ needs.discover.outputs.latest }}
          RELEASE: ${{ steps.gate.outputs.release }}
          BLOCKERS: ${{ steps.gate.outputs.blockers }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A upstream.lock.json VERSION .release
          git commit -m "Update libpqxx to $LATEST"
          git push origin "$BRANCH"
          body=release/build/upstream-candidate/pr-body.md
          cp release/build/upstream-candidate/report.md "$body"
          title="Update libpqxx to $LATEST"
          labels=(--label upstream)
          gh label create upstream --color 0E8A16 --description "Upstream update (upstream.yml)" --force >/dev/null
          if [ "$RELEASE" = "true" ] && [ "$AUTO_RELEASE" = "true" ]; then
            printf '\n## Auto-release\n\nThe release gate passed: this pull request is merged and released automatically.\n' >> "$body"
          else
            gh label create needs-review --color D93F0B --description "Needs a maintainer before release" --force >/dev/null
            labels+=(--label needs-review)
            [ "$OUTCOME" = "success" ] || title="$title (needs work)"
            if [ "$RELEASE" = "true" ]; then
              printf '\n## Auto-release\n\nThe release gate passed, but auto-release is off (UPSTREAM_AUTO_RELEASE=false).\n' >> "$body"
            else
              printf '\n## Auto-release\n\nNot released automatically:\n\n%s\n' "$BLOCKERS" >> "$body"
            fi
          fi
          url=$(gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$body" "${labels[@]}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Merge, tag and release
        if: steps.existing.outputs.exists == 'false' && steps.gate.outputs.release == 'true' && env.AUTO_RELEASE == 'true'
        shell: bash ./ci/run-ci bash -euo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.existing.outputs.base }}
          PR: ${{ steps.pr.outputs.url }}
          VERSION_EXPECTED: ${{ steps.gate.outputs.version }}
        run: |
          # The candidate was built on BASE: if main moved since, what would be released is untested.
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$BASE" ]; then
            gh label create needs-review --color D93F0B --description "Needs a maintainer before release" --force >/dev/null
            gh pr edit "$PR" --add-label needs-review
            gh pr comment "$PR" --body "Not released automatically: main moved from \`${BASE:0:12}\` to \`${head:0:12}\` while the candidate was built. Merge and cut by hand (\`vlr cut $VERSION_EXPECTED --push\`), or re-run Upstream watch after deleting this branch."
            exit 0
          fi
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$(git rev-parse HEAD)"
          git fetch --quiet origin main
          git switch --quiet -C main origin/main
          [ "$(tr -d '[:space:]' < VERSION)" = "$VERSION_EXPECTED" ] || { echo "::error::main's VERSION is not $VERSION_EXPECTED"; exit 1; }
          # VERSION is already set and unreleased, so `vlr cut` tags the merge commit (no version commit).
          vlr cut "$VERSION_EXPECTED" --push --skip-tests --json > release/build/cut.json
          cat release/build/cut.json
          tag=$(python3 -c 'import json; print(json.load(open("release/build/cut.json"))["tag"])')
          gh workflow run release.yml --ref "$tag" -f publish=publish
          gh pr comment "$PR" --body "Released automatically: tagged \`$tag\` and started release.yml on it (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/release.yml)."
